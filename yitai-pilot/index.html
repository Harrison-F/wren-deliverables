me": "Indigo Blue Selvedge Denim", "url": "https://www.yitai.la/products/indigo-blue-selvedge-denim", "description": "Limited sizes and quantities are available for immediate shipping Sizes 28/30, 30/30, 32/30, 32/32, and 34/32 are estimated to ship by December 10th to 15th. This is selvedge denim the way it's supposed to work, 13.5oz 100% cotton, woven on a shuttle loom, raw and untreated. The indigo is at its deepest on day one. From here it only gets more interesting. Wear these consistently and the fabric begins to record your life. Whiskers form at the hip where the fabric creases when you sit. Honeycombs develop behind the knee. The thighs fade along the lines of your movement. Every pair eventually becomes unique to the person wearing them, a fade pattern that belongs to no one else. Please note as these are raw denim, they’ll feel firm and structured at first. With regular wear, the fabric will gradually soften and mold to your body, creating a fit and fade pattern that’s unique to you. Detailed Features 13.5 oz. Indigo Dyed Raw Selvedge (Sanforized) 100% Cotton Relaxed Straight Leg Fit Mid - Rise Oeko-Tex Certified Fabric Metal Rivet Details Leather Patch Flat Felled Seam Construction Sizing Note Please note that size 30×30, 30X32, 32X30, and 32X32 ordered after September 16th are estimated to ship October 15th to 20th, 2026. The male model is 6’0”/184CM and weighs 140 lbs/63KG wearing a size 30/32 Our selvedge denim is tagged true to size. If the label says 32, it measures 32 with a natural allowance of approximately 1 inch due to the handcrafted nature of the construction. No vanity sizing. Order your true waist size. If you are between sizes, size down for a cleaner fit through the thigh as the denim breaks in. For the most accurate fit, compare the measurements below with a pair of jeans you already own. If you need personalized sizing advice, contact us directly. Inseam Note 30” Inseam: 5’6”–5’10” (168–178 cm) 32” Inseam: 5’11”–6’3” (180–191 cm) Denim
