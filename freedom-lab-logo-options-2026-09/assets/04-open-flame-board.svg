  <path fill="none" stroke="#49E05B" stroke-width="30" stroke-linecap="square" d="M112 326h288M150 382h212"/>
  <path fill="none" stroke="#49E05B" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter" d="M222 398v82h112"/>
</g></g>
