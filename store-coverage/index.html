<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Store coverage</title><style>
:root{color-scheme:dark;--bg:#121511;--panel:#191d18;--line:#353b32;--ink:#f1f1e7;--muted:#a6ad9e;--accent:#cae995}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Helvetica Neue',sans-serif}main{max-width:1800px;margin:auto;padding:clamp(22px,4vw,70px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:24px}h1{font:normal clamp(40px,5.5vw,84px)/1 Georgia,serif;letter-spacing:-.055em;margin:0}button{cursor:pointer;color:var(--accent);background:transparent;border:1px solid #58634c;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}button:hover,button:focus-visible{background:#303928;outline-color:var(--accent)}button:disabled{opacity:.5}button svg{width:20px;height:20px}.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:18px 0;color:var(--muted);font:12px/1.4 ui-monospace,monospace}.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:73vh;scrollbar-color:#626b59 var(--panel)}table{border-spacing:0;width:100%;font-variant-numeric:tabular-nums;text-align:right;font-size:13px}td,th{padding:14px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}thead th{color:#c5cbbd;font-weight:500;background:#252b23;position:sticky;top:0;z-index:2;text-align:right}th:first-child{position:sticky;left:0;text-align:left;border-right:1px solid var(--line)}thead th:first-child{z-index:3}tbody th{background:var(--panel);font-size:15px;font-weight:550;padding-left:16px}tr:hover td,tr:hover th[scope=row]{background:#22291f}small{display:block;font:11px/1.45 ui-monospace,monospace;color:var(--muted)}td.cache{color:var(--accent)}.unknown{color:#899181}details{max-width:225px}summary{cursor:pointer;list-style-position:inside}details p{white-space:normal;font-weight:400;color:var(--muted);font-size:13px}footer{display:flex;flex-wrap:wrap;gap:5px 18px;padding:16px 0;color:var(--muted);font-size:12px}@media(max-width:600px){main{padding:24px 12px}td,th{padding:11px 8px}tbody th{max-width:155px;white-space:normal;font-size:14px}.wrap{max-height:74vh}}
</style><main><header><h1>Store coverage</h1><button id="refresh" aria-label="Refresh checkpoint" title="Refresh checkpoint"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M19.5 11a7.5 7.5 0 1 0-2.2 6.5"/></svg></button></header><div class="meta"><span id="count">Store checkpoints</span><span id="status" role="status">Loading…</span></div><div class="wrap" tabindex="0" role="region" aria-label="Store coverage table"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><footer><span>Coverage measures field presence, not verified accuracy.</span><span>— Not measured</span><span>Open a store name for scope.</span></footer></main><script>
const $=s=>document.querySelector(s), cols={color:'Color',category:'Category',named:'Material named',composition:'Material % known',size:'Size',price:'Price',currency:'Currency',sale:'Sale',available:'Stock',image:'Image'}, fmt=n=>n.toLocaleString(), node=(tag,text)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;return e}, valid=n=>Number.isInteger(n)&&n>=0;
for(const label of ['Store','Cached / discovered','Field basis',...Object.values(cols),'Checkpoint']){const th=node('th',label);th.scope='col';$('#head').append(th)}
function percent(n,d){if(!valid(n)||!valid(d)||!d||n>d)return '—';if(n===d)return '100%';if(n===0)return '0%';const p=100*n/d;return p>99.9?'>99.9%':p<0.1?'<0.1%':Number(p.toFixed(1))+'%'}
let last='',busy=false;function render(stores){const body=document.createDocumentFragment(),opened=new Set([...document.querySelectorAll('details[open] summary')].map(x=>x.textContent));for(const s of stores){const tr=node('tr'),th=node('th'),de=node('details');th.scope='row';de.open=opened.has(s.name);de.append(node('summary',s.name),node('p',s.scope||'Scope not measured.'));th.append(de,node('small',s.status||'Not measured'));tr.append(th);const add=(text,cls)=>{const c=node('td',text);c.className=cls||'';tr.append(c);return c};const cache=add(percent(s.cached,s.discovered),'cache');if(valid(s.cached)||valid(s.discovered))cache.append(node('small',(valid(s.cached)?fmt(s.cached):'—')+' / '+(valid(s.discovered)?fmt(s.discovered):'—')));add(valid(s.total)?fmt(s.total)+' '+(s.unit||''):'—');for(const k of Object.keys(cols)){const n=s.fields?.[k],p=percent(n,s.total);const cell=add(p,p==='—'?'unknown':'');if(p!=='—')cell.title=`${fmt(n)} / ${fmt(s.total)} ${s.unit}`};const d=new Date(s.checkpoint);const ck=add(s.checkpoint&&!isNaN(d)?d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—');if(s.checkpoint)ck.title=s.checkpoint;body.append(tr)}$('#rows').replaceChildren(body);$('#count').textContent=stores.length+' stores'}
async function refresh(){if(busy)return;busy=true;$('#refresh').disabled=true;try{const r=await fetch('snapshot.json?check='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const json=await r.json();if(!Array.isArray(json.stores)||!json.stores.length||json.stores.some(s=>!s||typeof s.name!=='string'))throw Error();const text=JSON.stringify(json.stores);if(text!==last){render(json.stores);last=text}$('#status').textContent='Checked '+new Date().toLocaleTimeString()+' · Auto-refresh 1 min'}catch{$('#status').textContent=last?'Refresh failed · Showing previous checkpoint':'Checkpoint unavailable · Retry with ↻'}finally{busy=false;$('#refresh').disabled=false}}
$('#refresh').onclick=refresh;document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{if(!document.hidden)refresh()},60000);refresh();
</script></html>
